version: 2
updates:
  # Python dependencies via uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions:
        patterns:
          - "*"

  # MCP server image base (Dockerfile). Digest and patch bumps only: the Python minor
  # stays tied to VERIFY_PYTHON in release.yml and moves with it deliberately.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
