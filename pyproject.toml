[project]
name = "dep-rank"
dynamic = ["version"]
description = "Rank a GitHub repo's dependents by stars or trust heuristic, and search their code — CLI and MCP server."
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "j7an"}
]
readme = "README.md"
keywords = [
    "github",
    "github-api",
    "github-stars",
    "dependents",
    "reverse-dependencies",
    "dependency-graph",
    "dependency-analysis",
    "supply-chain",
    "ranking",
    "code-search",
    "developer-tools",
    "cli",
    "docker",
    "mcp",
    "mcp-server",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "selectolax>=0.3,<1",
    "pydantic>=2.0,<3",
    "click>=8.2,<9",
    "rich>=13.0,<15",
    "httpx2>=2.13,<3",
]

[project.optional-dependencies]
mcp = ["fastmcp>=4.1.3,<4.2"]

[project.scripts]
dep-rank = "dep_rank.cli.app:cli"

[project.urls]
Homepage = "https://github.com/j7an/dep-rank"
Repository = "https://github.com/j7an/dep-rank"
Issues = "https://github.com/j7an/dep-rank/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "diff-cover>=10.2",
    "dep-rank[mcp]",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "1 week"

[tool.uv.exclude-newer-package]
# fastmcp 4.1.3 / certifi 2026.10.19: CA-incident security fix; remove after 2026-10-28
fastmcp = "2026-10-21T00:00:00Z"
fastmcp-slim = "2026-10-21T00:00:00Z"
certifi = "2026-10-21T00:00:00Z"
# virtualenv 21.14.13: GHSA-cx6f-vjhg-g3cc fix; remove after 2026-10-30
virtualenv = "2026-10-23T00:00:00Z"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }

[tool.coverage.run]
branch = true
source = ["dep_rank"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
# Additions to coverage.py 7.10+ default exclusions (which already cover
# `# pragma: no cover`, `if (typing\.)?TYPE_CHECKING:`, and one-line ellipsis
# stubs like `def foo() -> int: ...`). Each entry below excludes the matching
# line and its suite. Patterns are unanchored regexes; false positives are
# handled with `# pragma: no cover` on the offending line.
exclude_also = [
    'if __name__ == .__main__.:',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-v",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:The logging capability is deprecated:mcp.shared.exceptions.MCPDeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "dep_rank.cli.app"
disallow_untyped_decorators = false

[tool.pyright]
# Editor type checking only (mypy is the CI gate); resolve imports from the uv env.
venvPath = "."
venv = ".venv"
